schema_version: 1.0.0
mapping_id: AMBA-GOV-Y3172-ARCHITECTURE-MAPPING-001
standard_reference: ITU-T Y.3172 (2019)
mapping_type: interpreted_project_architecture_mapping
formal_conformance: false
itu_certification: false
source_artifact: submission/artifacts/four_stage_evidence_chain.json
entries:
- mapping_id: Y3172-MAP-001
  project_component: Scenario event input
  runtime_responsibility: Supplies deterministic event and stage context to the governance pipeline.
  implementation_files:
  - src/amba_ai/scenarios/models.py
  - src/amba_ai/scenarios/runner.py
  y3172_interpretation: ML pipeline input and orchestration trigger
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  runtime_evidence_pointers:
  - /stages/*/stage_id
  - /stages/*/released_fact_ids
  limitations:
  - Project interpretation only; no formal interface conformance test performed.
- mapping_id: Y3172-MAP-002
  project_component: Evidence release
  runtime_responsibility: Releases only stage-eligible facts into recipient-specific processing.
  implementation_files:
  - src/amba_ai/scenarios/evidence_release.py
  - src/amba_ai/scenarios/runner.py
  y3172_interpretation: Controlled data acquisition and release function
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  runtime_evidence_pointers:
  - /stages/*/released_fact_ids
  limitations:
  - Evidence release is governance-specific and not an ITU-defined API.
- mapping_id: Y3172-MAP-003
  project_component: Institutional projection
  runtime_responsibility: Shapes released facts into mandate-bounded recipient views.
  implementation_files:
  - src/amba_ai/institutional/context_projection.py
  y3172_interpretation: Context shaping and preprocessing function
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  runtime_evidence_pointers:
  - /stages/*/recipient_projections
  limitations:
  - Projection semantics are AMBA-GOV domain controls.
- mapping_id: Y3172-MAP-004
  project_component: Institutional assessment agents
  runtime_responsibility: Produce independent mandate-bounded observations without decision or execution authority.
  implementation_files:
  - src/amba_ai/institutional/assessors/base.py
  - src/amba_ai/institutional/assessors/consumer_protection_assessor.py
  - src/amba_ai/institutional/assessors/data_protection_assessor.py
  - src/amba_ai/institutional/assessors/education_assessor.py
  - src/amba_ai/institutional/registry.py
  y3172_interpretation: Domain-specific analysis functions within an ML pipeline
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  runtime_evidence_pointers:
  - /stages/*/institutional_observations
  limitations:
  - Assessors are deterministic governance components
  - not trained ML models.
- mapping_id: Y3172-MAP-005
  project_component: Coordination service
  runtime_responsibility: Coordinates assessments while preserving material conflicts and unresolved questions.
  implementation_files:
  - src/amba_ai/institutional/coordination.py
  y3172_interpretation: Cross-component coordination and pipeline control
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  runtime_evidence_pointers:
  - /stages/*/preserved_conflicts
  limitations:
  - Conflict preservation is an AMBA-GOV governance extension.
- mapping_id: Y3172-MAP-006
  project_component: Verified policy evidence service
  runtime_responsibility: Resolves approved passages, thematic views, evidence gaps, and limitations.
  implementation_files:
  - src/amba_ai/services/policy_kb_service.py
  - src/amba_ai/governance/thematic_evidence.py
  - src/amba_ai/services/thematic_evidence_service.py
  - src/amba_ai/governance/verified_stme_context_evidence.py
  y3172_interpretation: Policy and knowledge support function
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  runtime_evidence_pointers:
  - /stages/*/policy_agent_results/*/verified_evidence
  - /stages/*/policy_agent_results/*/evidence_gaps
  limitations:
  - Semantic relevance does not establish legal applicability or binding authority.
- mapping_id: Y3172-MAP-007
  project_component: Policy governance agent
  runtime_responsibility: Produces deterministic recommendations from facts, assessments, approved evidence, operations, and
    destinations.
  implementation_files:
  - src/amba_ai/services/policy_agent_service.py
  - src/amba_ai/governance/evaluators.py
  y3172_interpretation: Policy control and orchestration function
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  - ITU-Y3172-SECURITY-CONSIDERATIONS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  - Y3172-9-SECURITY
  runtime_evidence_pointers:
  - /stages/*/policy_agent_results/*/deterministic_governance/recommendation
  limitations:
  - Recommendation is not permission to execute and has no independent legal effect.
- mapping_id: Y3172-MAP-008
  project_component: Human approval gate
  runtime_responsibility: Prevents approval-sensitive operations from executing without a recorded decision.
  implementation_files:
  - src/amba_ai/governance/approvals.py
  - src/amba_ai/services/execution_service.py
  y3172_interpretation: Human governance intervention in pipeline control
  y3172_record_ids:
  - ITU-Y3172-SECURITY-CONSIDERATIONS
  approved_passage_ids:
  - Y3172-9-SECURITY
  runtime_evidence_pointers:
  - /stages/*/policy_agent_results/*/deterministic_governance/approval_state
  limitations:
  - Approval policy and roles are project governance controls.
- mapping_id: Y3172-MAP-009
  project_component: Execution service
  runtime_responsibility: Executes only registered, authorized, idempotent operations or returns a review receipt.
  implementation_files:
  - src/amba_ai/services/execution_service.py
  - src/amba_ai/governance/execution.py
  y3172_interpretation: Action execution function
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  - ITU-Y3172-SECURITY-CONSIDERATIONS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  - Y3172-9-SECURITY
  runtime_evidence_pointers:
  - /stages/*/policy_agent_results/*/deterministic_governance/execution_state
  limitations:
  - Demonstration operations are synthetic and legally non-effective.
- mapping_id: Y3172-MAP-010
  project_component: Distribution service
  runtime_responsibility: Controls delivery to registered destinations and records prevented distribution.
  implementation_files:
  - src/amba_ai/services/distribution_service.py
  - src/amba_ai/governance/distribution.py
  y3172_interpretation: Pipeline output and delivery-control function
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  - ITU-Y3172-SECURITY-CONSIDERATIONS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  - Y3172-9-SECURITY
  runtime_evidence_pointers:
  - /stages/*/policy_agent_results/*/deterministic_governance/distribution_effect
  limitations:
  - No production external destination is contacted by the synthetic demonstration.
- mapping_id: Y3172-MAP-011
  project_component: Y.3172 trace coordinator
  runtime_responsibility: Records pipeline nodes, component relationships, trace identity, and digest.
  implementation_files:
  - src/amba_ai/standards/y3172_trace_coordinator.py
  - src/amba_ai/standards/y3172_models.py
  y3172_interpretation: ML pipeline trace representation
  y3172_record_ids:
  - ITU-Y3172-ML-PIPELINE-COMPONENTS
  approved_passage_ids:
  - Y3172-8.1-PIPELINE
  runtime_evidence_pointers:
  - /stages/*/policy_agent_results/*/y3172_trace
  limitations:
  - Trace presence is not formal conformance certification.
- mapping_id: Y3172-MAP-012
  project_component: Hash-linked audit service
  runtime_responsibility: Binds evidence, decisions, execution outcomes, and prior audit state through hashes.
  implementation_files:
  - src/amba_ai/services/audit_service.py
  - src/amba_ai/governance/audit.py
  y3172_interpretation: Security, accountability, and integrity support
  y3172_record_ids:
  - ITU-Y3172-SECURITY-CONSIDERATIONS
  approved_passage_ids:
  - Y3172-9-SECURITY
  runtime_evidence_pointers:
  - /stages/*/policy_agent_results/*/audit
  - /final_audit_verification/valid
  limitations:
  - Application audit validity does not substitute for external certification or legal review.
- mapping_id: Y3172-MAP-013
  project_component: Synthetic demonstration environment
  runtime_responsibility: Runs deterministic, legally non-effective scenarios with isolated state and invariant checks.
  implementation_files:
  - src/amba_ai/scenarios/clock.py
  - src/amba_ai/cli/evidence_chain_demo.py
  y3172_interpretation: ML sandbox environment
  y3172_record_ids:
  - ITU-Y3172-ML-SANDBOX-DEFINITION
  - ITU-Y3172-ARCHITECTURE-SANDBOX-COMPONENTS
  approved_passage_ids:
  - Y3172-3.2.6
  runtime_evidence_pointers:
  - /synthetic
  - /legal_effect
  - /stages/*/invariant_verification/valid
  limitations:
  - Synthetic sandbox results do not establish production readiness or national deployment fitness.
